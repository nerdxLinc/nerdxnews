<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NerdXNews | JOIN THE NERD X ARMY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #050505;
            color: #f4f4f5;
            font-family: 'Space Grotesk', sans-serif;
            overflow-x: hidden;
        }
        h1, h2, h3, .heading-font {
            font-family: 'Orbitron', sans-serif;
            letter-spacing: -0.05em;
        }
        /* RESTORED: Orange Glow for Text with Yellow Highlights */
        .retro-glow {
            text-shadow: 0 0 10px rgba(234, 88, 12, 0.8), 0 0 20px rgba(250, 204, 21, 0.4);
        }
        /* ADDED: Specific Orange Stroke effect */
        .title-stroke {
             -webkit-text-stroke: 1px rgba(234, 88, 12, 0.5);
             text-shadow: 0 0 15px rgba(234, 88, 12, 0.3);
        }
        .btn-retro {
            background: #EA580C;
            color: white;
            box-shadow: 6px 6px 0px 0px #000;
            transition: all 0.1s ease;
            border: 2px solid #fff;
        }
        .btn-retro:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px #000;
            background: #FACC15;
            color: black;
            border-color: #000;
        }
        .btn-retro:active {
            transform: translate(4px, 4px);
            box-shadow: 0px 0px 0px 0px #000;
        }
        .halftone {
            background-image: radial-gradient(circle, rgba(234, 88, 12, 0.1) 1px, transparent 1px);
            background-size: 15px 15px;
        }
        .scanline {
            width: 100%;
            height: 4px;
            z-index: 100;
            background: rgba(255, 255, 255, 0.03);
            position: fixed;
            bottom: 100%;
            pointer-events: none;
            animation: scanline 4s linear infinite;
        }
        @keyframes scanline {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .glass {
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(20px);
        }
        ::-webkit-scrollbar {
            width: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #EA580C;
            border: 2px solid #000;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #FACC15;
        }
    </style>

</head>
<body>
    <div id="root"></div>
    <div class="scanline"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
