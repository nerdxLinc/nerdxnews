<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NerdXNews | JOIN THE NERD X ARMY</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    body {
      background-color: #050505;
      color: #f4f4f5;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
    }
    h1, h2, h3, .heading-font {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: -0.05em;
    }

    .retro-glow {
      text-shadow: 0 0 10px rgba(234, 88, 12, 0.8), 0 0 20px rgba(250, 204, 21, 0.4);
    }

    .title-stroke {
      -webkit-text-stroke: 1px rgba(234, 88, 12, 0.5);
      text-shadow: 0 0 15px rgba(234, 88, 12, 0.3);
    }

    .btn-retro {
      background: #EA580C;
      color: white;
      box-shadow: 6px 6px 0px 0px #000;
      transition: all 0.1s ease;
      border: 2px solid #fff;
    }
    .btn-retro:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0px 0px #000;
      background: #FACC15;
      color: black;
      border-color: #000;
    }
    .btn-retro:active {
      transform: translate(4px, 4px);
      box-shadow: 0px 0px 0px 0px #000;
    }

    .halftone {
      background-image: radial-gradient(circle, rgba(234, 88, 12, 0.1) 1px, transparent 1px);
      background-size: 15px 15px;
    }

    /* CRT scanline: MUST NEVER block clicks */
    .scanline {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.03);
      position: fixed;
      left: 0;
      top: 0;
      pointer-events: none; /* key: cannot intercept clicks */
      z-index: 1;          /* low, just visual */
      animation: scanline 4s linear infinite;
    }

    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(100vh); }
    }

    .glass {
      background: rgba(10, 10, 10, 0.95);
      backdrop-filter: blur(20px);
    }

    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb {
      background: #EA580C;
      border: 2px solid #000;
    }
    ::-webkit-scrollbar-thumb:hover { background: #FACC15; }

    /* TipTap Editor Styles */
    .ProseMirror {
      min-height: 300px;
      padding: 1rem;
      color: #e4e4e7;
      font-family: 'Space Grotesk', sans-serif;
      outline: none;
    }
    .ProseMirror p {
      margin-bottom: 1rem;
    }
    .ProseMirror h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-top: 1.5rem;
      margin-bottom: 0.75rem;
      color: white;
    }
    .ProseMirror h3 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 1.25rem;
      margin-bottom: 0.5rem;
      color: white;
    }
    .ProseMirror ul, .ProseMirror ol {
      padding-left: 1.5rem;
      margin-bottom: 1rem;
    }
    .ProseMirror blockquote {
      border-left: 3px solid #ea580c;
      padding-left: 1rem;
      margin: 1rem 0;
      color: #a1a1aa;
      font-style: italic;
    }
    .ProseMirror img {
      max-width: 100%;
      height: auto;
      border-radius: 0.5rem;
      margin: 1rem 0;
      cursor: pointer;
    }
    .ProseMirror img.ProseMirror-selectednode {
      outline: 3px solid #ea580c;
    }
    .ProseMirror img[data-float="left"] {
      float: left;
      max-width: 45%;
      margin: 0.5rem 1rem 0.5rem 0;
    }
    .ProseMirror img[data-float="right"] {
      float: right;
      max-width: 45%;
      margin: 0.5rem 0 0.5rem 1rem;
    }
    .ProseMirror iframe {
      max-width: 100%;
      margin: 1rem 0;
      border-radius: 0.5rem;
    }
    .ProseMirror .is-editor-empty:first-child::before {
      content: attr(data-placeholder);
      float: left;
      color: #52525b;
      pointer-events: none;
      height: 0;
    }
    .ProseMirror::after {
      content: "";
      display: table;
      clear: both;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <div class="scanline"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
